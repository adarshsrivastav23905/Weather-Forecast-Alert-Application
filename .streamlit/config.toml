[theme]
base = "light"
primaryColor = "#087E83"
backgroundColor = "#F4F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#132338"
borderColor = "#DCE5EC"
linkColor = "#087E83"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 17
baseFontWeight = 400
headingFontWeights = [700, 650, 600, 550, 500, 500]
headingFontSizes = ["40px", "32px", "26px", "22px", "19px", "17px"]
baseRadius = "large"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
chartCategoricalColors = ["#087E83", "#4772C4", "#D18B35", "#8B6BC1", "#D15F68", "#4D9871", "#78899B"]
dataframeHeaderBackgroundColor = "#EDF3F6"

[theme.sidebar]
backgroundColor = "#EDF3F6"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#132338"
borderColor = "#DCE5EC"
primaryColor = "#087E83"

[theme.dark]
primaryColor = "#64D8CB"
backgroundColor = "#101923"
secondaryBackgroundColor = "#182532"
textColor = "#E8F0F5"
borderColor = "#2D3C49"
linkColor = "#64D8CB"
chartCategoricalColors = ["#64D8CB", "#81A9F2", "#E6AD62", "#B89BE8", "#EF858C", "#76B995", "#A3B1BE"]
dataframeHeaderBackgroundColor = "#223443"

[theme.dark.sidebar]
backgroundColor = "#111E2A"
secondaryBackgroundColor = "#1A2A38"
textColor = "#E8F0F5"
borderColor = "#2D3C49"
primaryColor = "#64D8CB"
